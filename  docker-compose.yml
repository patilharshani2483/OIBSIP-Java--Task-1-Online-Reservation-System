
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: reservation_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "3307:3306"
    volumes:
      - reservation_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/reservation_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-admin}

volumes:
  reservation_mysql_data:
