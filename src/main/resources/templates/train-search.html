<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Search Trains | Online Reservation System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .search-hero {
            padding: 28px;
            border-radius: 16px;
            color: white;
            background: linear-gradient(120deg, #0b2d4f, #0876df);
            margin-bottom: 24px;
        }

        .panel-card {
            background: white;
            padding: 24px;
            border: 1px solid #e6edf5;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 5px 20px rgba(20, 50, 80, 0.05);
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr)) auto;
            gap: 16px;
            align-items: end;
        }

        .search-grid label {
            display: block;
            font-weight: 600;
            color: #123456;
        }

        .search-grid input {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #d6e0ec;
            border-radius: 9px;
        }

        .search-button {
            padding: 12px 22px;
            border: 0;
            border-radius: 9px;
            background: #0876df;
            color: white;
            font-weight: 700;
        }

        .search-button:hover {
            background: #075eb3;
        }

        .train-table th {
            background: #f0f5fb;
            color: #4d6580;
            white-space: nowrap;
        }

        .train-table td,
        .train-table th {
            padding: 14px;
            vertical-align: middle;
        }

        .empty-state {
            text-align: center;
            padding: 35px !important;
            color: #71839b;
        }

        @media (max-width: 900px) {
            .search-grid {
                grid-template-columns: 1fr 1fr;
            }

            .search-button {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 600px) {
            .search-grid {
                grid-template-columns: 1fr;
            }

            .search-button {
                grid-column: auto;
                width: 100%;
            }

            .panel-card {
                padding: 16px;
            }

            .search-hero {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Shared Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-layout">

        <!-- Shared Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('search')}"></div>

        <div class="app-main-wrapper">

            <main class="main-content">

                <!-- Page Heading -->
                <section class="search-hero">
<h1 class="fw-bold" style="color: #f5f5dc;">Find Your Train 🚆</h1>	  <p class="mb-0">
                        Search available trains by source and destination station.
                    </p>
                </section>

                <!-- Search Form -->
                <section class="panel-card">

                    <h4 class="fw-bold mb-3">Search Trains</h4>

                    <form method="get"
                          th:action="@{/trains/search}"
                          class="search-grid">

                        <label>
                            From Station
                            <input type="text"
                                   name="source"
                                   th:value="${source}"
                                   placeholder="e.g. Mumbai Central">
                        </label>

                        <label>
                            To Station
                            <input type="text"
                                   name="destination"
                                   th:value="${destination}"
                                   placeholder="e.g. Ahmedabad">
                        </label>

                        <button type="submit" class="search-button">
                            Search Trains
                        </button>

                    </form>

                    <div class="mt-3">
                        <a th:href="@{/reservation}">Book a Ticket</a>
                        <span class="mx-2">|</span>
                        <a th:href="@{/my-bookings}">My Bookings</a>
                    </div>

                </section>

                <!-- Search Results -->
                <section class="panel-card">

                    <div class="d-flex justify-content-between
                                align-items-center flex-wrap gap-2 mb-3">

                        <h4 class="fw-bold mb-0">Available Trains</h4>

                        <span class="badge text-bg-primary"
                              th:text="${#lists.size(trains)} + ' train(s)'">
                            0 trains
                        </span>

                    </div>

                    <div class="table-responsive">

                        <table class="table table-hover train-table">

                            <thead>
                                <tr>
                                    <th>Train Number</th>
                                    <th>Train Name</th>
                                    <th>From</th>
                                    <th>To</th>
                                    <th>Total Seats</th>
                                    <th>Action</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="train : ${trains}">

                                    <td th:text="${train.trainNumber}">
                                        12951
                                    </td>

                                    <td th:text="${train.trainName}">
                                        Train Name
                                    </td>

                                    <td th:text="${train.sourceStation}">
                                        Mumbai
                                    </td>

                                    <td th:text="${train.destinationStation}">
                                        Ahmedabad
                                    </td>

                                    <td th:text="${train.totalSeats}">
                                        100
                                    </td>

                                    <td>
                                        <a th:href="@{/reservation}"
                                           class="btn btn-primary btn-sm">
                                            Book
                                        </a>
                                    </td>

                                </tr>

                                <tr th:if="${#lists.isEmpty(trains)}">
                                    <td colspan="6" class="empty-state">
                                        <h5>No trains found</h5>
                                        <p class="mb-0">
                                            Check the station names and try again.
                                        </p>
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

            </main>

            <!-- Shared Footer -->
            <div th:replace="~{fragments/footer :: footer}"></div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
