<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booking Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="page-bg">
<div class="container py-5" style="max-width:720px">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <div class="text-success fs-1">✓</div>
            <h1 class="fw-bold text-success">Booking Successful!</h1>
            <p class="text-secondary">Save your PNR to find or cancel this reservation later.</p>
            <div class="pnr-box my-4">
                <div class="small text-secondary">YOUR PNR NUMBER</div>
                <div class="display-6 fw-bold" th:text="${reservation.pnr}"></div>
            </div>
            <h4>Booking Details</h4>
            <dl class="row mt-3">
                <dt class="col-sm-5">Passenger</dt><dd class="col-sm-7" th:text="${reservation.passengerName}"></dd>
                <dt class="col-sm-5">Train</dt><dd class="col-sm-7"><span th:text="${reservation.trainNumber}"></span> - <span th:text="${reservation.trainName}"></span></dd>
                <dt class="col-sm-5">From</dt><dd class="col-sm-7" th:text="${reservation.sourceStation}"></dd>
                <dt class="col-sm-5">To</dt><dd class="col-sm-7" th:text="${reservation.destinationStation}"></dd>
                <dt class="col-sm-5">Class</dt><dd class="col-sm-7" th:text="${reservation.classType}"></dd>
                <dt class="col-sm-5">Journey Date</dt><dd class="col-sm-7" th:text="${reservation.journeyDate}"></dd>
            </dl>
            <a th:href="@{/dashboard}" class="btn btn-primary">Back to Dashboard</a>
            <a th:href="@{/reservation}" class="btn btn-outline-primary">Book Another Ticket</a>
        </div>
    </div>
</div>
</body>
</html>
